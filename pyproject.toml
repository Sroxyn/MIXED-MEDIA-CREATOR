[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixedmedia"
version = "0.1.0"
description = "MixedMedia Round-Trip Studio - video to paper to video"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7",
    # headless: GUI (highgui) ve videoio modülleri hiç kullanılmıyor — ffmpeg'i
    # kendimiz subprocess ile çağırıyoruz. Headless sürüm pakete gömülen
    # gereksiz 29 MB'lık videoio DLL'ini de getirmiyor. contrib şart (ArUco).
    "opencv-contrib-python-headless>=4.9",
    "numpy>=1.26",
    "Pillow>=10.2",
    "PyMuPDF>=1.24",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mm = "mixedmedia.cli:main"

[project.gui-scripts]
mixedmedia = "mixedmedia.ui.app:main"

[tool.setuptools.packages.find]
include = ["mixedmedia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
